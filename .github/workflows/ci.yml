name: Core regression
on:
  push:
    branches: [main, fix/core-reliability]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify compiler
        run: g++ --version
      - name: Build, syntax, targeted regression, HX self-test and full E2E
        run: npm test
